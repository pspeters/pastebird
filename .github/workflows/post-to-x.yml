# Posts the changelog of a version on X by hand, or tests the X secrets without posting (see .github/post-to-x.ps1).
# Releases post by themselves (the x job in release.yml); this is for testing and for posting a release again.
name: Post to X

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from CHANGELOG.md, for example 1.7.2
        required: true
      mode:
        description: check = sign in and show the post, nothing posted; dry-run = only show the post; post = post it on X
        type: choice
        options: [check, dry-run, post]
        default: check

permissions:
  contents: read

jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - shell: pwsh
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          VERSION: ${{ inputs.version }}
          MODE: ${{ inputs.mode }}
        run: |
          switch ($env:MODE) {
            'check' { .github/post-to-x.ps1 -Version $env:VERSION -Check }
            'dry-run' { .github/post-to-x.ps1 -Version $env:VERSION -DryRun }
            'post' { .github/post-to-x.ps1 -Version $env:VERSION }
          }
