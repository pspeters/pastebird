# Builds the macOS app on every change to it, so a build error shows up right away. The release workflow
# also runs this to build the app for a release. The .dmg and .zip are kept as a workflow artifact.
#
# With these repository secrets the app is signed with the Developer ID certificate and notarized by Apple
# (see docs/BUILDING.md); without them it is signed ad hoc:
#   MACOS_CERTIFICATE_P12       the "Developer ID Application" certificate with its private key, as base64
#   MACOS_CERTIFICATE_PASSWORD  the password of that .p12
#   NOTARY_API_KEY              the contents of the App Store Connect API key (AuthKey_….p8)
#   NOTARY_KEY_ID, NOTARY_ISSUER_ID  that key's Key ID and Issuer ID
name: macOS build

on:
  push:
    branches: ['**'] # not for version tags: the release workflow builds those
    paths: ['mac/**', 'CHANGELOG.md', 'src/Pastebird/Languages/**', '.github/workflows/mac.yml']
  pull_request:
    paths: ['mac/**', 'src/Pastebird/Languages/**', '.github/workflows/mac.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7

      # A temporary keychain with only the signing certificate; it disappears with the runner.
      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          # The certificate and its private key (the .p12 holds both).
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -f pkcs12 -A -k "$keychain"
          rm "$RUNNER_TEMP/certificate.p12"
          # Apple's intermediate certificates, so the chain to Apple's root is complete (newer certificates use G2).
          for ca in DeveloperIDG2CA DeveloperIDCA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$keychain" || true
          done
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          if [ -z "$identity" ]; then
            echo "Signing identities in the imported certificate:"
            security find-identity -p codesigning "$keychain"
            echo "::error::No valid 'Developer ID Application' certificate with its private key in MACOS_CERTIFICATE_P12"
            exit 1
          fi
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Prepare notarization key
        if: env.NOTARY_API_KEY != ''
        run: |
          echo "$NOTARY_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build
        run: bash mac/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Pastebird-mac
          path: |
            mac/build/Pastebird-*.dmg
            mac/build/Pastebird-mac-*.zip
          retention-days: 14
