# Finishes a release that release.ps1 published: adds the macOS app and submits the new version to winget.
# The Windows installer is built and signed locally by release.ps1, because the signing key is in Certum
# SimplySign, which GitHub Actions can't use. A release created with your own gh login triggers this workflow.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # A separate job, so a problem with the Mac build never holds up the Windows release; the Mac updater only
  # offers a version once its zip is there. The build itself (signed and notarized when the secrets exist) is in mac.yml.
  mac-build:
    uses: ./.github/workflows/mac.yml
    secrets: inherit

  mac:
    needs: mac-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Pastebird-mac

      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" "Pastebird-$version.dmg" "Pastebird-mac-$version.zip" --repo "$GITHUB_REPOSITORY"

  # Opens a pull request on microsoft/winget-pkgs for the new version (see packaging/winget/README.md).
  # Skipped until the WINGET_TOKEN secret exists.
  winget:
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@a8fff44b123f115ce4c21543edf8b677376fc7e0 # main, 2026-09-20
        with:
          identifier: PSpeters.Pastebird
          installers-regex: 'PastebirdSetup-.*\.exe$'
          release-tag: ${{ github.ref_name }}
          token: ${{ secrets.WINGET_TOKEN }}
